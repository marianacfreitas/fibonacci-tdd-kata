[project]
name = "fibonacci-tdd-kata"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marianacfreitas", email = "marianacfreitas2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fibonacci-tdd-kata = "fibonacci_tdd_kata.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.ruff.lint.per-file-ignores]
# marimo cells intentionally end on a bare expression to define what the
# cell displays — that pattern is exactly what flake8-bugbear's B018
# ("useless expression") flags, so it's disabled for notebook files.
"notebooks/*.py" = ["B018"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90




